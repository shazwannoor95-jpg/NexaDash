plugins { id 'com.android.application' }

// Keep one canonical manifest shared with the existing shell build.
def studioManifest = layout.buildDirectory.file('generated/studio/AndroidManifest.xml')
def prepareManifest = tasks.register('prepareStudioManifest') {
    inputs.file(rootProject.file('AndroidManifest.xml'))
    outputs.file(studioManifest)
    doLast {
        def out = studioManifest.get().asFile
        out.parentFile.mkdirs()
        out.text = rootProject.file('AndroidManifest.xml').getText('UTF-8').replaceFirst(/\s+package="[^"]+"/, '')
    }
}
android {
    namespace 'com.shazwan.sagadash'
    compileSdk 35
    defaultConfig {
        applicationId 'com.shazwan.nexadash.lab'
        minSdk 24
        targetSdk 29
        versionCode 42
        versionName '1.6.7-nexadash.8-native10'
    }
    sourceSets {
        main {
            manifest.srcFile studioManifest.get().asFile
            java.srcDirs = [rootProject.file('src')]
            res.srcDirs = [rootProject.file('res')]
            assets.srcDirs = [rootProject.file('assets')]
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    buildTypes { release { minifyEnabled false } }
    lint {
        // Personal OEM head-unit APK distributed directly, not through Google Play.
        // Keep target 29 compatibility; continue checking all other release lint issues.
        disable 'ExpiredTargetSdkVersion'
    }
}
tasks.named('preBuild').configure { dependsOn prepareManifest }

// Re-sign an already patched companion with this computer's Studio debug key.
// No private key is copied into the repository; APK source is supplied explicitly.
tasks.register('resignNativeCompanion') {
    dependsOn 'assembleDebug'
    doLast {
        def inputPath = providers.gradleProperty('nativeCompanion').orNull
        if (!inputPath) throw new GradleException('Pass -PnativeCompanion=/absolute/path/to/patched-companion.apk')
        def inputApk = rootProject.file(inputPath)
        if (!inputApk.isFile() || !inputApk.name.endsWith('.apk')) throw new GradleException('Patched companion APK not found')
        def signer = new File(android.sdkDirectory, 'build-tools/' + android.buildToolsVersion + (System.getProperty('os.name').toLowerCase().contains('windows') ? '/apksigner.bat' : '/apksigner'))
        def debugKey = android.signingConfigs.debug
        def outputApk = layout.buildDirectory.file('outputs/native-companion/' + inputApk.name.replace('.apk', '-debug.apk')).get().asFile
        outputApk.parentFile.mkdirs()
        exec {
            environment 'NEXA_DEBUG_STORE_PASS', debugKey.storePassword
            environment 'NEXA_DEBUG_KEY_PASS', debugKey.keyPassword
            commandLine signer.absolutePath, 'sign', '--ks', debugKey.storeFile.absolutePath,
                '--ks-key-alias', debugKey.keyAlias, '--ks-pass', 'env:NEXA_DEBUG_STORE_PASS',
                '--key-pass', 'env:NEXA_DEBUG_KEY_PASS', '--out', outputApk.absolutePath, inputApk.absolutePath
        }
        println 'Debug companion: ' + outputApk.absolutePath
    }
}
