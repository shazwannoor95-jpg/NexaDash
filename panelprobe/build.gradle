plugins { id 'com.android.application' }
android {
    namespace 'com.shazwan.embedprobe.target'
    compileSdk 35
    defaultConfig { applicationId 'com.shazwan.embedprobe.target'; minSdk 26; targetSdk 27; versionCode 2; versionName 'native1' }
    sourceSets { main { manifest.srcFile rootProject.file('tools/optin-panel-probe/target/AndroidManifest.xml'); java.srcDirs=[rootProject.file('tools/optin-panel-probe/target/src')]; res.srcDirs=[rootProject.file('tools/optin-panel-probe/target/res')] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
